<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="googlebot" content="noindex,nofollow">
<title>サーバーコンサル山中シミュレーター</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f5f5f7;color:#222}
header{background:#fff;padding:13px 16px;border-bottom:1px solid #ddd;font-weight:800}.stats{display:flex;gap:8px;padding:8px 12px;background:#fff}.stats span{background:#eeeef3;padding:6px 9px;border-radius:7px;font-size:12px}
#chat{height:calc(100dvh - 205px);overflow:auto;padding:15px}.row{display:flex;margin:12px 0}.me{justify-content:flex-end}.b{max-width:78%;background:#fff;padding:11px 13px;border-radius:9px;line-height:1.55;box-shadow:0 1px 2px #0001}.me .b{background:#e4e6ff}.who{font-size:12px;font-weight:800;margin-bottom:4px}
#choices{display:flex;gap:7px;overflow:auto;padding:8px 10px;background:#fff}.c{white-space:nowrap;border:1px solid #bbb;padding:8px 11px;border-radius:18px;font-size:12px;cursor:pointer}
.input{display:flex;gap:6px;background:#fff;padding:9px 10px}input{flex:1;padding:12px;border:1px solid #aaa;border-radius:7px;font-size:15px}button{border:0;background:#5b5fc7;color:#fff;border-radius:7px;padding:0 15px;font-weight:bold}
</style></head><body>
<header>🔥 山中（サーバーコンサル）</header>
<div class="stats"><span>メンタル <b id="mental">100</b></span><span>山中の信頼 <b id="trust">50</b></span></div>
<div id="chat"></div><div id="choices"></div><div class="input"><input id="inp" placeholder="返信を入力"><button onclick="free()">送信</button></div>
<script>
let m=100,t=50,stage=0;
const flow=[
{q:"おい、この手配表誰が確認したんだよ。サーバー台数とビール本数、合ってねえだろ。今すぐ確認しろ。",
 opts:[
 ["申し訳ありません。こちらの確認不足です。今すぐ再確認します。","謝って終わりにするな。何分で終わる？時間を切れ。","good"],
 ["合っている認識です。","認識じゃねえ。根拠出せ。手配表の数字を今ここで説明しろ。","bad"],
 ["手配担当からもらった情報です。","誰からもらったか聞いてねえよ。お前が確認したのかって聞いてんだ。","bad"]]},
{q:"で、確認に何分かかる。曖昧に答えるな。",
 opts:[
 ["10分で確認して報告します。","よし。10分だ。サーバー、ビール、ガスまで全部見ろ。","good"],
 ["少々お待ちください。","少々って何分だよ。仕事で時間も切れないのか。具体的に言え。","bad"],
 ["担当に確認します。","また担当かよ。丸投げするな。お前が責任持って確認しろ。","bad"]]},
{q:"確認したな？ じゃあサーバーは結局何台だ。台数だけ答えろ。",
 opts:[
 ["ダブル3台、シングル2台、合計5台です。","最初からそう答えろ。次。WOCへの出庫依頼は何時に出した？","good"],
 ["5台の想定です。","想定じゃねえ。確定か未確定かどっちだ。今ここで確定させろ。","bad"],
 ["少々お待ちください。","さっき10分で確認したんじゃねえのか。何を確認したんだよ。やり直せ。","bad"]]},
{q:"WOCへの出庫依頼、何時に出した？ 受領確認まで取れてるのか。",
 opts:[
 ["15:20に依頼済み、15:32に受領確認済みです。","そこまで確認できてるならいい。配送先の住所と現場担当者も照合したか？","good"],
 ["チャットには送っています。","送っただけで仕事終わりにするな。受けたか確認しろ。今すぐ電話しろ。","bad"],
 ["たぶん対応済みです。","『たぶん』で物流回すな。確認取れるまで次に進むな。","bad"]]},
{q:"配送先住所、現場担当者、電話番号。全部、手配情報と一致してるか？",
 opts:[
 ["はい。3項目すべて照合済みです。","よし。じゃあ最後だ。ビール、サーバー、ガス、カップ、配送をもう一回読み上げて確認しろ。","good"],
 ["住所だけ確認しました。","なんで住所だけなんだよ。事故る前に全部確認しろ。中途半端な仕事するな。","bad"],
 ["現場担当に任せています。","任せたで逃げるな。管理する側が把握してなくてどうすんだ。全部確認しろ。","bad"]]},
{q:"最終確認だ。ビール、サーバー、ガス、カップ、配送。全部問題ないと言い切れるな？",
 opts:[
 ["はい。全項目、数量・配送・受領まで確認済みです。","……よし。そこまで確認したなら進めろ。明日ミスするなよ。","good"],
 ["ほぼ問題ありません。","『ほぼ』って何だよ。100％にしてから報告しろ。全部やり直し。","bad"],
 ["朝もう一度確認します。","明日の仕事を明日の朝に残すな。今日終わらせろ。今すぐ確認しろ。","bad"]]}
];
function add(x,me=false){const d=document.createElement("div");d.className="row "+(me?"me":"");d.innerHTML='<div class="b">'+(!me?'<div class="who">山中</div>':'')+x.replace(/\n/g,"<br>")+"</div>";chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function show(){
 if(stage>=flow.length){choices.innerHTML="";add(t>=70?"<b>GOOD END：山中チェック突破</b><br>催事は予定どおり開始された。":"<b>BAD END：手配表、全項目再提出</b><br>山中から『最初からやり直せ』が飛んできた。");return}
 add(flow[stage].q); choices.innerHTML="";
 flow[stage].opts.forEach(o=>{const d=document.createElement("div");d.className="c";d.textContent=o[0];d.onclick=()=>pick(o);choices.appendChild(d)})
}
function pick(o){add(o[0],true); if(o[2]=="good"){t+=7;m-=4}else{t-=8;m-=13} mental.textContent=Math.max(m,0);trust.textContent=Math.max(0,t);choices.innerHTML="";setTimeout(()=>{add(o[1]);stage++;setTimeout(show,650)},450)}
function free(){let x=inp.value.trim();if(!x)return;inp.value="";add(x,true);
 let s=x.replace(/\s/g,"");
 let reply;
 if(/担当|任せ|たぶん|思います|認識/.test(s)){reply="人のせいにするな。曖昧な言葉も使うな。お前が確認して、事実で答えろ。";t-=8;m-=12}
 else if(/確認します|待ち|少々/.test(s)){reply="で、何分だ？期限を言え。『確認します』だけで終わるな。";t-=3;m-=8}
 else if(/\d/.test(s)||/済み|確認済|完了|一致/.test(s)){reply="よし。数字と事実で答えればいいんだよ。次もその調子で答えろ。";t+=5;m-=3}
 else{reply="それで俺の質問に答えたつもりか？結論から答えろ。数字か事実で言え。";t-=5;m-=9}
 mental.textContent=Math.max(m,0);trust.textContent=Math.max(0,t);setTimeout(()=>{add(reply);stage++;setTimeout(show,650)},450)}
inp.addEventListener("keydown",e=>{if(e.key==="Enter")free()});show();
</script></body></html>
