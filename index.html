<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<title>サーバーコンサル山中シミュレーター</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f5f5f7;color:#242424}
header{background:#fff;padding:14px 18px;border-bottom:1px solid #ddd;font-weight:800}.stats{display:flex;gap:8px;padding:10px;background:#fff}.stats span{background:#eeeef3;padding:7px;border-radius:7px;font-size:13px}
#chat{height:calc(100vh - 210px);overflow:auto;padding:16px}.m{margin:12px 0;display:flex}.me{justify-content:flex-end}.b{max-width:80%;background:white;padding:11px 13px;border-radius:9px;line-height:1.5;box-shadow:0 1px 2px #0001}.me .b{background:#e5e7ff}
#choices{display:flex;overflow:auto;gap:6px;padding:8px;background:white}.c{white-space:nowrap;border:1px solid #bbb;border-radius:18px;padding:8px;font-size:12px}
.input{display:flex;padding:10px;background:white;gap:6px}input{flex:1;padding:12px;border:1px solid #aaa;border-radius:7px}button{border:0;background:#5b5fc7;color:white;border-radius:7px;padding:0 15px;font-weight:bold}
</style></head><body>
<header>🔥 山中（サーバーコンサル）</header>
<div class="stats"><span>メンタル <b id="mental">100</b></span><span>山中の信頼 <b id="trust">50</b></span></div>
<div id="chat"></div><div id="choices"></div>
<div class="input"><input id="inp" placeholder="返信を入力"><button onclick="free()">送信</button></div>
<script>
let m=100,t=50,n=0;
const q=[
["これ誰が確認した？\nサーバー台数とビール本数、合ってないだろ。今すぐ確認しろ。",["申し訳ありません。すぐ確認します。","合っている認識です。","担当に確認してもらっています。"]],
["『確認します』じゃない。明日だぞ。\n今まで何を確認してた？ 10分で全部洗い直して報告しろ。",["私の確認不足です。10分で再確認します。","手配担当からの情報を転記しました。","一度整理して共有します。"]],
["で、結局サーバー何台なんだよ。\n余計な説明はいらない。聞いてることだけ答えろ。",["ダブル3台、シングル2台です。","少々お待ちください。","現状5台の想定です。"]],
["『想定』って何だよ。\n明日の現場だぞ。曖昧な状態で進めるな。今ここで確定させろ。",["確定数は5台です。配送も再確認します。","現場判断になると思います。","すみません、確認中です。"]],
["WOCへの出庫依頼は？何時に出した？\nスクショはいらない。事実だけ答えろ。受領確認まで取れ。",["本日15:20に依頼済み、受領確認済みです。","チャットには投げています。","たぶん対応済みです。"]],
["『たぶん』で物流回すな。\nサーバー来なかったらどうするんだよ。今すぐ確認取って報告しろ。",["私が今すぐ受領確認まで取ります。","山中さんにも確認いただけますか。","明日は予備機があります。"]],
["最後に確認するぞ。\nビール、サーバー、ガス、カップ、配送。全部チェックしろ。終わるまで報告上げるな。",["はい。全項目再確認済みです。","ほぼ大丈夫です。","朝もう一度確認します。"]]
];
function add(x,me=false){let d=document.createElement("div");d.className="m "+(me?"me":"");d.innerHTML='<div class="b">'+x.replace(/\n/g,"<br>")+"</div>";chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function ask(){if(n>=q.length){add(t>=75?"……そこまで確認したならいい。明日ミスするなよ。<br><b>GOOD END：山中チェック突破</b>":"この状態で明日やれるわけないだろ。全部やり直せ。今日中に終わらせろ。<br><b>BAD END：山中から再提出命令</b>");choices.innerHTML="";return}add(q[n][0]);choices.innerHTML="";q[n][1].forEach((x,i)=>{let d=document.createElement("div");d.className="c";d.textContent=x;d.onclick=()=>reply(x,i);choices.appendChild(d)})}
function reply(x,i){add(x,true);m-=i?15:5;t+=i?-8:7;n++;mental.textContent=Math.max(m,0);trust.textContent=Math.max(t,0);setTimeout(ask,500)}
function free(){let x=inp.value.trim();if(!x)return;inp.value="";add(x,true);m-=8;t+=2;n++;mental.textContent=m;trust.textContent=t;setTimeout(ask,500)}
ask();
</script></body></html>
